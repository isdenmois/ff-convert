# ff-convert preset configuration (copy to ~/.config/ff-convert/config.yaml
# or mount into Docker and point FF_CONVERT_CONFIG at it).
#
# When this file exists:
#   - default_preset is used as the video format and the format question is
#     skipped entirely;
#   - audio.normalize, when set, skips the loudnorm question;
#   - attachments, when set ("copy" or "omit"), skips the attachment question.
# Audio/subtitle track selection is always asked — it depends on file content.

# Preset used without asking:
default_preset: av1

# Optional custom presets (merge over the built-ins; same name overrides).
# Built-ins: copy, av1, hevc, hevc-nvenc, hevc-vaapi.
presets:
  av1-fast:
    codec: libsvtav1
    args: ["-preset", "8", "-crf", "30"]
    pix_fmt: yuv420p
  # example hardware preset:
  # hevc-nvenc-hq:
  #   codec: hevc_nvenc
  #   args: ["-preset", "p7", "-cq", "23"]

# Optional audio defaults (skips the corresponding question).
audio:
  bitrate: 128k
  normalize: false

# Optional attachments default: copy | omit (skips the question).
attachments: copy
