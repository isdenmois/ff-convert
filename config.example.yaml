# ff-convert preset configuration (copy to ~/.config/ff-convert/config.yaml
# or mount into Docker and point FF_CONVERT_CONFIG at it).
#
# Defaults without this file:
#   - the video codec is asked once per queue item and preselected with "copy";
#   - loudness normalization is asked once per queue item and preselected "on";
#   - attachments are asked once per queue item and preselected "copy";
#   - outputs land in ./converted (override with FF_CONVERT_OUTPUT_DIR).
#
# When this file exists:
#   - default_preset, when set, is used for every file and the codec question
#     is skipped entirely;
#   - audio.normalize, when set, skips the loudnorm question;
#   - attachments, when set ("copy" or "omit"), skips the attachment question.
# Audio/subtitle track selection is always asked — it depends on file content.

# Preset used for every file without asking ("copy" when unset):
#default_preset: copy

# Optional custom presets (merge over the built-ins; same name overrides).
# Built-ins: copy, av1, hevc, hevc-nvenc, hevc-vaapi, av1-nvenc.
#
# The presets below target playback on a modern phone (HEVC + AV1 decode),
# capped at 720p — scale=min(1280\,iw):-2 downscales wider sources, never
# upscales smaller ones. Pick per encoding machine:
#   desktop (RTX 40/50) → av1-nvenc-mobile (any source, incl. HDR)
#   laptop (Vega 8 APU) → hevc-vaapi-mobile (SDR only — VCN 1.0 encodes
#                         8-bit HEVC, no AV1; VAAPI is its only hw path on
#                         Linux) or mobile-av1 for HDR, patiently
#   any CPU, fallback   → mobile-av1 (HDR-safe) / mobile-hevc (SDR)
#
# HDR: 10-bit (yuv420p10le) presets keep HDR sources HDR — ffmpeg propagates
# the source color tags (bt2020/smpte2084) through the encode. Static HDR10
# metadata (master-display, MaxCLL/MaxFALL), Dolby Vision and HDR10+ are not
# carried over. 8-bit presets keep the tags but crush HDR to 8-bit (heavy
# banding) — use them for SDR sources only.
#
# Docker: hardware encoders need device passthrough — NVENC requires the
# nvidia container runtime (--gpus all), VAAPI requires /dev/dri.
presets:
  hevc: # SDR, 8-bit (HEVC-capable Intel GPU, Skylake+)
    codec: hevc_qsv
    args: ["-preset", "slow", "-global_quality:v", "24"]
    pix_fmt: yuv420p
  hevc-hdr: # 10-bit HDR10; needs Main10 encode (verify on your GPU)
    codec: hevc_qsv
    args: ["-preset", "slow", "-global_quality:v", "24"]
    pix_fmt: p010le
  hevc-540:
    codec: hevc_qsv
    args: ["-preset", "slow", "-global_quality:v", "24"]
    pix_fmt: yuv420p
    vf: "scale=-2:540"
  av1-540:
    codec: libsvtav1
    args: ["-preset", "8", "-crf", "30"]
    pix_fmt: yuv420p10le
    vf: "scale=-2:540"
  # Intel Quick Sync: encoding runs on the GPU, decoding stays in software,
  # so any source codec works and only the encoder must be supported by the
  # chip. -global_quality is QSV's constant-quality (ICQ) mode — lower is
  # better/larger; 22–26 is the useful HEVC range, 26–30 for AV1. QSV picks
  # the default Intel render node on its own; pinning one on iGPU+Arc
  # systems needs -qsv_device, which a preset cannot express. An unsupported
  # codec/profile fails the job (no CPU fallback) — smoke-test one file
  # before setting a QSV preset as default_preset.
  h264:
    codec: h264_qsv
    args: ["-preset", "slow", "-global_quality:v", "22"]
    pix_fmt: yuv420p

# Optional audio defaults (skips the corresponding question).
audio:
  bitrate: 128k
  normalize: true

# Optional attachments default: copy | omit (skips the question).
attachments: copy

# Categories
categories: ["Anime", "Movies", "Series"]
