pre-commit:
  parallel: true
  commands:
    biome:
      root: "."
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,vue,css,html,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --write {staged_files}
      stage_fixed: true

    frontend-typecheck:
      root: "."
      glob: "*.{ts,vue}"
      run: bun run --cwd packages/shared typecheck && bun run --cwd web typecheck

    desktop-typecheck:
      root: "."
      glob: "cmd/ffconvert-desktop/frontend/*.{ts,vue}"
      # wailsjs/ bindings are generated by the wails CLI and may be absent on
      # machines that never built the desktop app; skip rather than fail.
      run: if [ -d cmd/ffconvert-desktop/frontend/wailsjs ]; then bun run --cwd cmd/ffconvert-desktop/frontend typecheck; fi

    frontend-tests:
      root: "."
      glob: "*.{ts,vue}"
      run: bun run --cwd packages/shared test && bun run --cwd web test

    go-format:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})" || { echo "Run 'just format' to fix:"; gofmt -l {staged_files}; exit 1; }

    go-test:
      glob: "*.go"
      run: go test ./...
